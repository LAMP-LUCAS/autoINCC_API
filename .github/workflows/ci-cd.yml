name: CI/CD Pipeline - AutoINCC

on:
  push:
    branches: [ "main", "develop", "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # 1. Pipeline de Testes e Qualidade (TDD & Lint)
  # ==========================================================
  test-and-quality:
    name: Tests & Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest-cov

      - name: Verificação de Sintaxe e Estilo (Lint)
        run: |
          # Checa erros de sintaxe críticos e variáveis indefinidas
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Alertas leves sem quebrar o pipeline
          flake8 app tests --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics

      - name: Executar Testes Automatizados (TDD)
        run: |
          pytest -v --cov=app --cov-report=term-missing

  # ==========================================================
  # 2. Validação de Build Docker
  # ==========================================================
  docker-build-check:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test-and-quality
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build da Imagem API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: autoincc_api:test
